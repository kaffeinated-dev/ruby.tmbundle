name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # As TextMate runs commands: with macOS's bash, and osascript to apply edits.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Test the format commands
      run: |
        bash -n Support/lib/format.sh
        ruby Support/test/test_format.rb
